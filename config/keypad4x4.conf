# ZMK Studio (zusätzlich zum Snippet studio-rpc-usb-uart in build.yaml)
CONFIG_ZMK_STUDIO=y

# Studio ohne Entsperr-Taste: So bleiben alle 16 Tasten frei belegbar.
# Folge: Jeder Rechner, an dem das Pad per USB hängt, könnte die Belegung
# ändern. Wer das nicht will, setzt hier y und legt &studio_unlock auf
# eine Taste.
CONFIG_ZMK_STUDIO_LOCKING=n

# Name, unter dem das Pad über USB und Bluetooth erscheint (höchstens 16 Zeichen).
CONFIG_ZMK_KEYBOARD_NAME="Keypad Thilo"
